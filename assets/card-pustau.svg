<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1124"/><stop offset=".55" stop-color="#070B17"/><stop offset="1" stop-color="#05070D"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3D86FF"/><stop offset="1" stop-color="#0A3FD8"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1F5BFF" stop-opacity=".45"/><stop offset="1" stop-color="#1F5BFF" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1B2547" stroke-width="1"/></pattern>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
<radialGradient id="cg" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#F59E0B" stop-opacity=".35"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></radialGradient>
<clipPath id="cc"><rect width="600" height="270" rx="24"/></clipPath></defs>
<style>@font-face{font-family:'S8';src:url(data:font/woff2;base64,) format('woff2');font-weight:800}@font-face{font-family:'S5';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}@font-face{font-family:'JM';src:url(data:font/woff2;base64,) format('woff2');font-weight:500}@font-face{font-family:'DV';src:url(data:font/woff2;base64,) format('woff2');font-weight:600}
.nm{font:800 40px 'S8',sans-serif;fill:#F3F5FA;letter-spacing:-.03em}
.sb{font:500 15px 'JM',monospace;fill:#F59E0B;letter-spacing:.14em}
.dv{font:600 18px 'DV',sans-serif;fill:#F59E0B}
.ds{font:500 18px 'S5',sans-serif;fill:#A9B4D0}
.tg{font:500 14px 'JM',monospace;fill:#C9D3EA}
.ur{font:500 15px 'JM',monospace;fill:#7F8BAE}
@keyframes sw{0%{transform:translateX(-300px) skewX(-20deg)}60%,100%{transform:translateX(900px) skewX(-20deg)}}
@keyframes pl{0%,100%{r:5;opacity:1}50%{r:9;opacity:.35}}
@keyframes gl{0%,100%{opacity:.7}50%{opacity:1}}
</style>
<g clip-path="url(#cc)">
<rect width="600" height="270" fill="url(#bg)"/><rect width="600" height="270" fill="url(#cg)" style="animation:gl 4s infinite"/>
<rect width="600" height="270" fill="url(#grid)" opacity=".35"/>
<rect x="0" y="0" width="120" height="270" fill="#fff" opacity=".05" style="animation:sw 5s ease-in-out infinite"/>
<rect x="0" y="0" width="600" height="4" fill="url(#ac)"/>
<text class="nm" x="30" y="70">Pustau</text>
<text class="dv" x="30" y="100">पुस्तौ</text>
<text class="ds" x="30" y="142">A digital vamshavali: family tree, tithi and</text><text class="ds" x="30" y="168">patro in Bikram Sambat</text>
<rect x="30" y="198" width="118" height="34" rx="17" fill="#121B36" stroke="#22305C"/><text class="tg" x="89" y="221" text-anchor="middle">Next.js 16</text><rect x="156.0" y="198" width="118" height="34" rx="17" fill="#121B36" stroke="#22305C"/><text class="tg" x="215" y="221" text-anchor="middle">TypeScript</text><rect x="282.0" y="198" width="98" height="34" rx="17" fill="#121B36" stroke="#22305C"/><text class="tg" x="331" y="221" text-anchor="middle">Postgres</text><rect x="387.6" y="198" width="77" height="34" rx="17" fill="#121B36" stroke="#22305C"/><text class="tg" x="426" y="221" text-anchor="middle">Docker</text>
<circle cx="450" cy="49" r="5" fill="#28C840" style="animation:pl 2s infinite"/>
<text class="ur" x="570" y="55" text-anchor="end">LIVE ↗</text>
<text class="ur" x="570" y="246" text-anchor="end" opacity=".7">pustau.com</text>
</g>
<rect x=".5" y=".5" width="599" height="269" rx="24" fill="none" stroke="#22305C"/>
</svg>